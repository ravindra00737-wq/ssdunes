<!DOCTYPE html>
<html>
<head>
<title>Employee Voting</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body { font-family: Arial; background: #f5f2f6; margin: 0; padding: 20px; }
.navbar { background: #6d3063; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
.navbar h1 { margin: 0; }
.tab { background: rgba(255,255,255,0.2); padding: 10px 20px; border: none; color: white; cursor: pointer; margin-right: 10px; border-radius: 5px; }
.tab.active { background: white; color: #6d3063; }
.card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; }
input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; }
button { background: #6d3063; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="navbar">
  <h1>🏆 Employee of the Month</h1>
  <button class="tab active" onclick="showTab('nominate')">📝 Nominate</button>
  <button class="tab" onclick="showTab('vote')">️ Vote</button>
  <button class="tab" onclick="showTab('admin')">️ Admin</button>
</div>

<div id="nominate" class="tab-content">
  <div class="card">
    <h2>Submit Nomination</h2>
    <input type="text" id="leaderName" placeholder="Your Name">
    <input type="text" id="leaderDept" placeholder="Your Department">
    <input type="text" id="nomName" placeholder="Nominee Name">
    <input type="text" id="nomDept" placeholder="Nominee Department">
    <select id="nomCategory">
      <option value="">Select Category</option>
      <option value="Host of the Month (FOH)">Host of the Month (FOH)</option>
      <option value="Host of the Month (HOH)">Host of the Month (HOH)</option>
      <option value="Leader of the Quarter">Leader of the Quarter</option>
      <option value="Sustainability Hero">Sustainability Hero</option>
    </select>
    <textarea id="nomDesc" placeholder="Why they deserve this award?" rows="4"></textarea>
    <button onclick="submitNomination()">Submit</button>
  </div>
</div>

<div id="vote" class="tab-content hidden">
  <div class="card">
    <h2>Cast Your Vote</h2>
    <input type="text" id="voterName" placeholder="Your Name">
    <input type="text" id="voterDept" placeholder="Your Department">
    <button onclick="startVoting()">Start Voting</button>
  </div>
  <div id="votingForm" class="card hidden">
    <h3>Rate Nominees (1-10)</h3>
    <div id="nomineesList"></div>
    <button onclick="submitVotes()">Submit Votes</button>
  </div>
</div>

<div id="admin" class="tab-content hidden">
  <div class="card">
    <h2>Admin Dashboard</h2>
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="checkAdmin()">Login</button>
    <div id="adminPanel" class="hidden">
      <h3>Nominations: <span id="nomCount">0</span></h3>
      <div id="nominationsList"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain: "sshostrecognition.firebaseapp.com",
  databaseURL: "https://sshostrecognition-default-rtdb.firebaseio.com",
  projectId: "sshostrecognition",
  storageBucket: "sshostrecognition.appspot.com",
  messagingSenderId: "717686789724",
  appId: "1:717686789724:web:XXXXXXXXXXXXXXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tab).classList.remove('hidden');
  event.target.classList.add('active');
}

function submitNomination() {
  const data = {
    leader: document.getElementById('leaderName').value,
    leaderDept: document.getElementById('leaderDept').value,
    nominee: document.getElementById('nomName').value,
    nomineeDept: document.getElementById('nomDept').value,
    category: document.getElementById('nomCategory').value,
    desc: document.getElementById('nomDesc').value
  };
  if (!data.leader || !data.nominee) { alert('Fill required fields'); return; }
  db.ref('nominations/' + Date.now()).set(data);
  alert('Submitted!');
}

function startVoting() {
  const name = document.getElementById('voterName').value;
  if (!name) { alert('Enter your name'); return; }
  document.getElementById('votingForm').classList.remove('hidden');
  loadNominees();
}

function loadNominees() {
  db.ref('nominations').on('value', snap => {
    const noms = snap.val() || {};
    document.getElementById('nomineesList').innerHTML = Object.values(noms).map(n => `
      <div style="margin:10px 0; padding:10px; background:#f5f2f6; border-radius:5px;">
        <strong>${n.nominee}</strong> (${n.category})<br>
        ${n.desc}<br>
        <input type="number" min="1" max="10" placeholder="Rate 1-10" data-nom="${n.nominee}">
      </div>
    `).join('');
  });
}

function submitVotes() {
  alert('Votes submitted!');
}

function checkAdmin() {
  if (document.getElementById('adminPass').value === 'Admin@2026') {
    document.getElementById('adminPanel').classList.remove('hidden');
    loadAdminData();
  } else {
    alert('Wrong password');
  }
}

function loadAdminData() {
  db.ref('nominations').on('value', snap => {
    const noms = Object.values(snap.val() || {});
    document.getElementById('nomCount').innerText = noms.length;
    document.getElementById('nominationsList').innerHTML = noms.map(n => `
      <div style="padding:10px; background:#f5f2f6; margin:5px 0; border-radius:5px;">
        <strong>${n.nominee}</strong> - ${n.category}<br>
        By: ${n.leader} (${n.leaderDept})
      </div>
    `).join('');
  });
}
</script>
</body>
</html>
